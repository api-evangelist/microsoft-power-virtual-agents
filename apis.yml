  description: >-
    The Copilot Studio Direct Line API enables custom applications to communicate with bots built in Microsoft
    Copilot Studio (formerly Power Virtual Agents). It provides REST endpoints for starting conversations,
    sending messages, receiving bot responses, and managing conversation sessions for custom channel integrations.
